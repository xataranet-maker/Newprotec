    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Hệ thống quản lý sản xuất tích hợp Newprotec." />
    
    <!-- PWA / App Mode configuration for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Newprotec" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <title>NEWPROTEC - System Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-app: #020617;
        --bg-panel: #0f172a;
        --text-main: #e2e8f0;
        --accent-color: #06b6d4;
        --font-primary: 'Bahnschrift', 'Segoe UI', sans-serif;
      }
      * { 
        font-family: var(--font-primary) !important; 
        -webkit-tap-highlight-color: transparent;
        scrollbar-width: thin;
        scrollbar-color: #111111 #000000; /* Firefox: Thumb & Track */
      }
      body {
        background-color: var(--bg-app);
        color: var(--text-main);
        overscroll-behavior-y: none;
        margin: 0;
        padding: 0;
      }

      /* PURE BLACK SCROLLBAR FOR WEBKIT (CHROME, SAFARI, EDGE) */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #111111; /* Màu đen cực tối để vẫn thấy được thanh cuộn */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1a1a1a;
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Đảm bảo thanh cuộn trong dashboard cũng màu đen */
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #000000;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #111111;
      }
    </style>
